  <script>
  const productSlider =
    document.getElementById("productSlider");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const sliderIndicators =
    document.getElementById("sliderIndicators");


const sliderProducts =
    document.querySelectorAll(".slider-product");


let currentPage = 0;


// How many products are visible
function productsPerPage() {

    if (window.innerWidth < 768) {

        return 1;

    }

    return 2;

}


// How many pages
function totalPages() {

    return Math.ceil(
        sliderProducts.length / productsPerPage()
    );

}


// Move slider
function updateSlider() {

    const perPage = productsPerPage();

    const percentage =
        currentPage * 100;

    productSlider.style.transform =
        `translatex(-${percentage}%)`;

    updateIndicators();

}


// NEXT
nextBtn.addEventListener("click", () => {

    if (currentPage < totalPages() - 1) {

        currentPage++;

        updateSlider();

    }

});


// PREVIOUS
prevBtn.addEventListener("click", () => {

    if (currentPage > 0) {

        currentPage--;

        updateSlider();

    }

});


// CREATE THE TWO HANDLES
function createIndicators() {

    sliderIndicators.innerHTML = "";

    const pages = totalPages();


    for (let i = 0; i < pages; i++) {

        const handle =
            document.createElement("button");

        handle.type = "button";

        handle.className =
            "w-2 h-2 rounded-full";


        handle.addEventListener("click", () => {

            currentPage = i;

            updateSlider();

        });


        sliderIndicators.appendChild(handle);

    }


    updateIndicators();

}


// ACTIVE HANDLE
function updateIndicators() {

    const handles =
        sliderIndicators.querySelectorAll("button");


    handles.forEach((handle, index) => {

        handle.classList.remove(
            "bg-pink-300",
            "bg-gray-300"
        );


        if (index === currentPage) {

            handle.classList.add("bg-pink-300");

        } else {

            handle.classList.add("bg-gray-300");

        }

    });

}


// Resize
window.addEventListener("resize", () => {

    const pages = totalPages();

    if (currentPage >= pages) {

        currentPage = pages - 1;

    }

    createIndicators();

    updateSlider();

});


// Start
createIndicators();

updateSlider();
</script>
